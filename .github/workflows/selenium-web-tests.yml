name: 1. Selenium Web Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Selenium Reports
        run: |
          python automated_tests/generate_all_reports.py

      - name: Upload Selenium Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Web-Test-Reports
          path: |
            automated_tests/web_ui_test_report.xlsx
            automated_tests/web_functional_test_report.xlsx
          if-no-files-found: error
