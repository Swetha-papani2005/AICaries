name: 4. Load Performance Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  load-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Load Reports
        run: |
          python automated_tests/generate_all_reports.py

      - name: Upload Load Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Load-Performance-Test-Reports
          path: |
            automated_tests/load_test_report.xlsx
          if-no-files-found: error
