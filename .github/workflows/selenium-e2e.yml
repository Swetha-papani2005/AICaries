name: AICaries E2E Testing (Selenium, Appium, Vulnerability, Load)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  testing-and-reports:
    name: Generate All Test Reports
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate E2E Excel Reports
        run: |
          python automated_tests/generate_all_reports.py

      - name: Upload E2E Test Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: E2E-Automation-Test-Reports
          path: |
            automated_tests/web_ui_test_report.xlsx
            automated_tests/web_functional_test_report.xlsx
            automated_tests/android_ui_test_report.xlsx
            automated_tests/android_functional_test_report.xlsx
            automated_tests/vulnerability_test_report.xlsx
            automated_tests/load_test_report.xlsx
          if-no-files-found: error
