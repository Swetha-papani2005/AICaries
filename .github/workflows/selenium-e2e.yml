name: AICaries E2E & Automation Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  testing-and-reports:
    name: Generate Test Reports and Run Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd web
          npm install

      - name: Build Web Application
        run: |
          cd web
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate E2E Excel Reports
        run: |
          python automated_tests/generate_all_reports.py

      - name: Upload E2E Test Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: E2E-Automation-Test-Reports
          path: |
            automated_tests/web_ui_test_report.xlsx
            automated_tests/web_functional_test_report.xlsx
            automated_tests/android_ui_test_report.xlsx
            automated_tests/android_functional_test_report.xlsx
            automated_tests/vulnerability_test_report.xlsx
            automated_tests/load_test_report.xlsx
          if-no-files-found: error
